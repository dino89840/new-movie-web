<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>CMFLIX VIP Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080a0f;
      color: white;
      font-family: sans-serif;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 30px auto;
    }

    .card {
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #303540;
      border-radius: 16px;
      background: #171a22;
    }

    input,
    select,
    button {
      min-height: 44px;
      padding: 10px 14px;
      margin: 5px;
      border-radius: 10px;
      border: 1px solid #3a404c;
      background: #222630;
      color: white;
    }

    input {
      width: min(100%, 340px);
    }

    select {
      min-width: 145px;
    }

    button {
      cursor: pointer;
    }

    .primary {
      background: #e50914;
      border-color: #e50914;
    }

    .purple {
      background: #6d28d9;
      border-color: #7c3aed;
    }

    .danger {
      background: #8b1118;
    }

    .muted {
      color: #a8adb8;
    }

    .user {
      padding: 16px 0;
      border-bottom: 1px solid #303540;
    }

    .user:last-child {
      border-bottom: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #ffb4ab;
    }

    #generatedCode {
      padding: 14px;
      margin: 10px 0;
      border: 1px dashed #8b5cf6;
      border-radius: 12px;
      background: #0d0b18;
      color: #f5e8ff;
      font-family: monospace;
      font-size: 18px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>CMFLIX VIP Admin</h1>

    <section
      id="loginCard"
      class="card"
      hidden
    >
      <h2>Admin Login</h2>

      <input
        id="identity"
        placeholder="Admin username or email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button
        id="loginButton"
        class="primary"
      >
        Login
      </button>
    </section>

    <section
      id="adminCard"
      class="card"
      hidden
    >
      <h2>User VIP</h2>

      <div>
        <input
          id="search"
          placeholder="Username သို့မဟုတ် email"
        >

        <button
          id="searchButton"
          class="primary"
        >
          Search
        </button>
      </div>

      <div id="results"></div>
    </section>

    <section
      id="promoCard"
      class="card"
      hidden
    >
      <h2>Promo Code ထုတ်ရန်</h2>

      <div class="actions">
        <select id="promoPlan">
          <option value="1">1 Month</option>
          <option value="3">3 Months</option>
          <option value="6">6 Months</option>
          <option value="12">12 Months</option>
        </select>

        <input
          id="promoMaxUses"
          type="number"
          min="1"
          max="1000"
          value="1"
          placeholder="Max uses"
        >

        <input
          id="promoExpiryDays"
          type="number"
          min="1"
          max="3650"
          value="30"
          placeholder="Expiry days"
        >

        <button
          id="createPromoButton"
          class="purple"
        >
          Generate Promo
        </button>
      </div>

      <div
        id="generatedCode"
        hidden
      ></div>

      <button
        id="copyPromoButton"
        hidden
      >
        Copy Code
      </button>

      <p class="muted">
        Generated code အပြည့်ကို server က နောက်တစ်ကြိမ်
        ပြန်မပေးပါ။ ထုတ်ပြီးရင် copy သိမ်းထားပါ။
      </p>
    </section>

    <section
      id="message"
      class="card"
      hidden
    ></section>
  </main>

  <script
    type="module"
    src="/vip-admin.js?v=2"
  ></script>
</body>
</html>
