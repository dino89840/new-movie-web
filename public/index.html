<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#080a0f">
  <title>CMFLIX</title>
  <link rel="stylesheet" href="/style.css?v=6">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-page="home" aria-label="Home">
      <span class="brand-mark">CM</span>
      <span>FLIX</span>
    </button>

    <nav class="nav">
      <button data-category="movies">Movies</button>
      <button data-category="series">Series</button>
      <button data-category="lugyi">Lugyi</button>
      <button data-page="favorites">Favorites</button>
    </nav>

    <button id="accountButton" class="icon-button" aria-label="Account">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0"/>
      </svg>
    </button>
  </header>

  <main id="app">
    <section class="loading-card">Loading CMFLIX…</section>
  </main>

  <div id="toast" class="toast"></div>

  <dialog id="authDialog" class="modal">
    <button class="modal-close" data-close-dialog>×</button>

    <div id="authContent"></div>
  </dialog>

  <dialog
    id="playerDialog"
    class="player-modal"
    aria-labelledby="playerTitle"
  >
    <div class="player-shell">
      <header class="player-header">
        <div class="player-heading">
          <span class="player-kicker">NOW PLAYING</span>
          <div id="playerTitle" class="player-title">
            CMFLIX
          </div>
        </div>

        <div class="player-header-actions">
          <button
            id="playerFullscreen"
            class="player-action-button"
            type="button"
            aria-label="Fullscreen"
            title="Fullscreen"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5"/>
              <path d="M16 3h5v5"/>
              <path d="M8 21H3v-5"/>
              <path d="M16 21h5v-5"/>
            </svg>
          </button>

          <button
            class="player-action-button player-close"
            data-close-player
            type="button"
            aria-label="Close player"
            title="Close"
          >
            ×
          </button>
        </div>
      </header>

      <div class="player-stage">
        <video
          id="videoPlayer"
          controls
          playsinline
          preload="metadata"
        ></video>

        <div
          id="playerStatus"
          class="player-status"
          role="status"
          aria-live="polite"
        >
          Video ပြင်ဆင်နေသည်…
        </div>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script type="module" src="/app.js?v=6"></script>
</body>
</html>
